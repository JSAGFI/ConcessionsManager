<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#006837">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Concessions Manager</title>
  <link rel="manifest" href="manifest.json?v=2">
  <link rel="icon" type="image/png" href="bethelBeeSmall.png?v=2">
  <link rel="apple-touch-icon" href="bethelBeeSmall.png?v=2">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #006837; }
    iframe { width: 100%; height: 100%; border: none; display: block; opacity: 0; transition: opacity 0.3s ease; }
    iframe.loaded { opacity: 1; }

    /* Instant Splash Screen */
    #splash {
      position: fixed; inset: 0; background: #006837;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10; color: white; font-family: -apple-system, sans-serif;
    }
    #splash img { width: 120px; height: auto; margin-bottom: 20px; }
    .spinner {
      width: 36px; height: 36px; border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #f2a900; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="bethelBeeSmall.png" alt="Bethel Bee">
    <div class="spinner"></div>
    <p style="margin-top: 15px; font-weight: 700; letter-spacing: 0.5px; font-size: 0.9rem;">LOADING INVENTORY...</p>
  </div>

  <iframe 
    id="appFrame"
    src="PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE"
    onload="hideSplash()">
  </iframe>

  <script>
    function hideSplash() {
      const splash = document.getElementById('splash');
      const frame = document.getElementById('appFrame');
      frame.classList.add('loaded');
      setTimeout(() => { splash.style.display = 'none'; }, 200);
    }
  </script>
</body>
</html>
